name: sync-toolmods-upstream

on:
  push:
    branches:
      - toolmods/build-194
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-toolmods-upstream
  cancel-in-progress: false

jobs:
  sync-releases:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ToolMods baseline
        uses: actions/checkout@v5
        with:
          ref: toolmods/build-194
          fetch-depth: 0

      - name: Rebase and dispatch release channels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Djihads80/Eglantine.git

          releases=$(gh api 'repos/Djihads80/Eglantine/releases?per_page=100')
          build_tag=$(jq -r '[.[] | select(.draft == false and .prerelease == true and (.tag_name | test("^build-[0-9]+$")))] | sort_by(.tag_name | ltrimstr("build-") | tonumber) | last | .tag_name // empty' <<< "$releases")
          rc_tag=$(jq -r '[.[] | select(.draft == false and .prerelease == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-rc[0-9]+$")))] | sort_by(.published_at) | last | .tag_name // empty' <<< "$releases")
          stable_tag=$(jq -r '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | last | .tag_name // empty' <<< "$releases")

          sync_channel() {
            local channel="$1"
            local tag="$2"
            local branch="toolmods/$channel"
            echo "Syncing channel=$channel from upstream tag=$tag"
            git fetch upstream "refs/tags/$tag:refs/tags/$tag"
            git checkout -B "$branch" toolmods/build-194
            if ! git rebase "$tag"; then
              git rebase --abort || true
              echo "Rebase conflict for $channel at $tag; channel skipped." >&2
              return 0
            fi
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              previous_tree=$(git rev-parse "refs/remotes/origin/$branch^{tree}")
              current_tree=$(git rev-parse 'HEAD^{tree}')
              if [[ "$previous_tree" == "$current_tree" ]] &&
                 git ls-remote --exit-code --tags origin "refs/tags/toolmods-$channel-$tag-*" >/dev/null; then
                echo "Channel $channel already published for $tag with unchanged contents; skipping."
                return 0
              fi
            fi
            git push origin HEAD:"refs/heads/$branch" --force
            gh workflow run toolmods-windows.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$branch" \
              -f publish_release=true \
              -f release_channel="$channel" \
              -f upstream_ref="$tag"
          }

          if [[ -n "$build_tag" ]]; then
            sync_channel test-build "$build_tag"
          else
            echo 'No numbered upstream build release found; test-build skipped.'
          fi

          if [[ -n "$rc_tag" ]]; then
            sync_channel test-rc "$rc_tag"
          else
            echo 'No upstream release candidate found; test-rc skipped.'
          fi

          if [[ -n "$stable_tag" ]]; then
            sync_channel stable "$stable_tag"
          else
            echo 'No official upstream release found; stable skipped.'
          fi
