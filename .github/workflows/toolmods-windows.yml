name: toolmods-windows

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: ToolMods release channel
        required: true
        type: choice
        options:
          - test-build
          - test-rc
          - stable
      upstream_ref:
        description: Exact upstream Eglantine release tag to build
        required: true
        type: string
      publish_release:
        description: Publish the verified package as a GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: toolmods-windows-${{ inputs.release_channel }}-${{ inputs.upstream_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_CACHE_TO: eglantine-toolmods-windows-v1
      SCCACHE_GHA_CACHE_FROM: eglantine-toolmods-windows-v1
    outputs:
      upstream_commit: ${{ steps.upstream.outputs.commit }}
      package_name: ${{ steps.package.outputs.name }}
      toolmods_version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out integration source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate upstream release and resolve commit
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/Djihads80/Eglantine/releases/tags/$UPSTREAM_REF")
          prerelease=$(jq -r '.prerelease' <<< "$release")
          case "$RELEASE_CHANNEL" in
            test-build)
              [[ "$UPSTREAM_REF" =~ ^build-[0-9]+$ && "$prerelease" == true ]] || {
                echo "test-build requires a numbered prerelease tag; got $UPSTREAM_REF" >&2
                exit 1
              }
              ;;
            test-rc)
              [[ "$UPSTREAM_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ && "$prerelease" == true ]] || {
                echo "test-rc requires a semantic RC prerelease tag; got $UPSTREAM_REF" >&2
                exit 1
              }
              ;;
            stable)
              [[ "$prerelease" == false ]] || {
                echo "stable requires a non-prerelease upstream Release; got $UPSTREAM_REF" >&2
                exit 1
              }
              ;;
            *) echo "Unknown release channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          git remote add upstream https://github.com/Djihads80/Eglantine.git
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_REF"
          commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          git merge-base --is-ancestor "$commit" HEAD || {
            echo "Integration branch does not contain upstream $UPSTREAM_REF ($commit)" >&2
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Validated $RELEASE_CHANNEL release $UPSTREAM_REF at $commit"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare bundled Python
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw -LiteralPath dist/toolmods-release.json | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP 'toolmods-python.zip'
          Invoke-WebRequest -Uri $metadata.python_url -OutFile $zip -MaximumRetryCount 3
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $metadata.python_archive_sha256) {
            throw 'Python archive SHA256 mismatch'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath artifact/python-runtime

      - name: Verify packages without system Python
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: ./tools/toolmods/verify-packages.ps1 -RuntimeDirectory artifact/python-runtime

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Configure sccache GitHub Actions cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/toolmods -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Verify Release optimization
        shell: pwsh
        run: ./tools/toolmods/verify-release.ps1 -BuildDirectory build/toolmods -ReportPath build/toolmods/release-check.json

      - name: Build
        shell: bash
        run: cmake --build build/toolmods --target yuzu yuzu-cmd --parallel

      - name: Report sccache statistics
        shell: bash
        run: sccache --show-stats

      - name: Verify package
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          ./tools/toolmods/verify-packages.ps1 -RuntimeDirectory artifact/python-runtime

      - name: Package artifact
        id: package
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $metadata = Get-Content -Raw -LiteralPath dist/toolmods-release.json | ConvertFrom-Json
          $version = [ordered]@{
            toolmods_version = $metadata.version
            release_channel = $env:RELEASE_CHANNEL
            upstream_release = $env:UPSTREAM_REF
            upstream_commit = $env:UPSTREAM_COMMIT
            toolmods_commit = $sha
            game_title_id = '04007EF01F8AE000'
            main_sha256 = '616e7d906936ea4c2d908d0553cf69779e60242d769c40722267ee8bcb98e79a'
            python_version = $metadata.python_version
            python_archive_sha256 = $metadata.python_archive_sha256
            item_catalog_count = $metadata.item_catalog_count
            item_catalog_sha256 = $metadata.item_catalog_sha256
          }
          $version | ConvertTo-Json | Set-Content -Encoding utf8 dist/VERSION.json
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/toolmods/bin/eglantine.exe artifact/eglantine.exe
          Copy-Item dist/tool_mods artifact/tool_mods -Recurse
          Copy-Item dist/VERSION.json artifact/VERSION.json
          Copy-Item dist/toolmods-release.json artifact/toolmods-release.json
          Copy-Item build/toolmods/release-check.json artifact/release-check.json
          Copy-Item CHANGELOG_TOOLMODS.md artifact/CHANGELOG_TOOLMODS.md
          $name = "Eglantine-toolmods-v$($metadata.version)-$env:RELEASE_CHANNEL-$env:UPSTREAM_REF-$($sha.Substring(0,7))-windows-x64.zip"
          Compress-Archive -Path artifact/* -DestinationPath $name
          "name=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "version=$($metadata.version)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-toolmods-${{ inputs.release_channel }}-${{ inputs.upstream_ref }}-${{ github.sha }}
          path: ${{ steps.package.outputs.name }}

  release:
    name: Publish ToolMods release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: eglantine-toolmods-${{ inputs.release_channel }}-${{ inputs.upstream_ref }}-${{ github.sha }}
          path: dist

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
          TOOLMODS_COMMIT: ${{ github.sha }}
          TOOLMODS_VERSION: ${{ needs.build.outputs.toolmods_version }}
        run: |
          set -euo pipefail
          asset=$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$asset"
          release_tag="toolmods-$RELEASE_CHANNEL-$UPSTREAM_REF-${TOOLMODS_COMMIT::7}"
          prerelease_flag=()
          if [[ "$RELEASE_CHANNEL" != stable ]]; then prerelease_flag+=(--prerelease); fi
          printf '## Eglantine ToolMods v%s\n\n**Release channel:** `%s`\n\n**Upstream Eglantine:** `%s`\n\n**Upstream source commit:** `%s`\n\n**ToolMods integration revision:** `%s`\n\n' \
            "$TOOLMODS_VERSION" "$RELEASE_CHANNEL" "$UPSTREAM_REF" "$UPSTREAM_COMMIT" "$TOOLMODS_COMMIT" > notes.md
          cat >> notes.md <<'EOF'
          ### Included ToolMods

          - Generic runtime Tool Mod host and per-mod UI protocol
          - Complete 1,355-entry ItemAdd catalog, including examination certificates and upgraded weapons
          - Friendship Adjust UI, character catalog, and runtime helper
          - Cooperative cancellation for running runtime actions
          - Bundled CPython 3.13.12: no system Python installation or PATH setup required
          - Fixed package-relative runtime path resolution in both UI launch paths
          - Release optimization and package checks before compilation

          ### Target game

          - Title ID: `04007EF01F8AE000`
          - `main` SHA-256: `616e7d906936ea4c2d908d0553cf69779e60242d769c40722267ee8bcb98e79a`

          Extract the ZIP as a whole into a complete Windows x64 Eglantine installation
          of the **matching upstream release**. This is a ToolMods overlay package;
          retain the upstream Qt DLLs and plugins. Keep both `tool_mods` and
          `python-runtime` beside `eglantine.exe`. Copying only the EXE is insufficient.
          `VERSION.json` records the exact upstream release, source commit, and
          ToolMods revision. The short revision is included in this Release title
          and asset filename so different builds are distinguishable.
          EOF
          gh release create "$release_tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TOOLMODS_COMMIT" \
            "${prerelease_flag[@]}" \
            --title "Eglantine ToolMods v$TOOLMODS_VERSION $RELEASE_CHANNEL: $UPSTREAM_REF [ToolMods ${TOOLMODS_COMMIT::7}]" \
            --notes-file notes.md
